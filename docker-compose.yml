services:
  domoscope:
    build:
      context: .
      dockerfile: Dockerfile
    image: domoscope:latest
    container_name: domoscope-app
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4004
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      # Mount host repository into /workspace for instant analysis
      - .:/workspace:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/api/local/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
